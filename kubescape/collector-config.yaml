apiVersion: v1
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: null
          memory: null
    processors:
      attributes/ksCloud:
        actions:
          - key: cluster_name
            value: do-fra1-kubecon-prep-cluster-henrik-ben
            action: upsert
      resource:
        attributes:
          - key: source
            value: kubescape
            action: upsert
      batch:
        send_batch_size: 10000
        timeout: 10s
    exporters:
      otlp:
        endpoint: otel-collector.default.svc.cluster.local:4317
        tls:
          insecure: true
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - attributes/ksCloud
            - resource
            - batch
          exporters:
            - otlp
        
        metrics:
          receivers:
            - otlp
          processors:
            - attributes/ksCloud
            - resource
            - batch
          exporters:
            - otlp
            - debug
        logs:
          receivers:
            - otlp
          processors:
            - attributes/ksCloud
            - batch
          exporters:
            - otlp


kind: ConfigMap
metadata:
  annotations:
    meta.helm.sh/release-name: kubescape
    meta.helm.sh/release-namespace: kubescape
  labels:
    app: ks-cloud-config
    app.kubernetes.io/component: ks-cloud-config
    app.kubernetes.io/instance: kubescape
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: kubescape-operator
    app.kubernetes.io/version: 1.25.6
    helm.sh/chart: kubescape-operator-1.25.6
    kubescape.io/ignore: "true"
    kubescape.io/tier: core
    tier: ks-control-plane
  name: otel-collector-config
  namespace: kubescape

